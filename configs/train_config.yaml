project:
  name: RBT
  seed: 42
  output_root: outputs/models

model:
  name: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
  instruction_tuned: true
  full_finetune: false
  gradient_checkpointing: true
  max_seq_len: 8192

lora:
  rank: 8

data:
  train_dataset: open-r1/DAPO-Math-17k-Processed
  train_dataset_config: en
  train_split: train
  max_train_samples: null

generation:
  use_vllm: true
  vllm_mode: colocate
  temperature: 1.0
  min_p: 0.01
  top_p: 1.0
  top_k: -1
  batch_size: 16
  max_prompt_length: 2048
  max_completion_length: 6144

rl:
  trainer_seed: 3407
  max_steps: 1000
  save_steps: 100
  num_rollouts: 8
  learning_rate: 5.0e-6
  lr_scheduler: constant
  warmup_ratio: 0.1
  weight_decay: 0.01
  loss_type: grpo # dapo, bnpo, ...
  use_kl: true
  beta: 0.05
  epsilon: 0.2
  optimizer: adamw_8bit
  logging_steps: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1

sft:
  dataset_name: unsloth/OpenMathReasoning-mini
  split: cot
  max_samples: null
  num_epochs: 2
  learning_rate: 2.0e-4
  per_device_train_batch_size: 1
  warmup_steps: 5
  logging_steps: 5
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  lr_scheduler_type: linear
  optim: adamw_8bit

sage:
  guide: branch # random, token
  q_min: 0.6
  q_max: 1.4
  branch:
    ratio: 0.3
    threshold: 1.2
    use_source: new
    detach_entropy: true
  random:
    eps_ub: 0.1
    eps_lb: 0.0
    sig_ub: 0.15
    sig_lb: 0.05
    N: 8
    decay_rate: 0.9
  token:
    alpha_ub: 0.3
    alpha_lb: 0.1
    sig_ub: 0.25
    sig_lb: 0.1
    N: 8
    decay_rate: 0.9
    use_source: new
    norm: minmax
    detach_surprisal: true

tracking:
  enabled: false
  project: SAGE

hub:
  upload: false
  user_id: null
  private: false
